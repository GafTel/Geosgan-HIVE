[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosgan-hive"
version = "0.8.0"
description = "GEOSGAN HIVE: hybrid multi-agent AI system (central supervisor + specialist agents on independent models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# W-stage (v0.8.0 Web & Document Engine) optional document libraries, approved by
# the owner: all permissively licensed, $0, executed locally, no network. They
# are LAZY-LOADED only by the document stages (W4/W5); without this extra the
# package imports and runs fully offline (document tools stay unregistered).
docs = [
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4",
    "defusedxml>=0.7",
]
# v0.9.0 M2 (MCP & API Engine): official MCP Python SDK as an OPTIONAL extra,
# lazy-loaded only by the MCP client modules; core installs/imports without it.
# Pin rationale (verified against the GitHub/PyPI advisory database): the 1.x
# line is in security maintenance; >=1.30 clears GHSA-qx49-fqc8-xw99
# (CVE-2026-115563, OAuth credential leak) and GHSA-84m7-p3x7-pcfv
# (CVE-2026-59951, unbounded session accumulation); <2 keeps the
# initialize-handshake protocol family. HIVE pins the negotiated protocol
# revision to 2025-06-18 itself (the SDK's LATEST constant is NOT used).
# License: MIT. Client-only usage: no OAuth flows, no server components.
mcp = [
    "mcp>=1.30,<2",
]

[project.scripts]
geosgan-hive = "geosgan_hive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires real provider credentials (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
