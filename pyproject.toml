[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geosgan-hive"
version = "0.7.0"
description = "GEOSGAN HIVE: hybrid multi-agent AI system (central supervisor + specialist agents on independent models)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# W-stage (v0.8.0 Web & Document Engine) optional document libraries, approved by
# the owner: all permissively licensed, $0, executed locally, no network. They
# are LAZY-LOADED only by the document stages (W4/W5); without this extra the
# package imports and runs fully offline (document tools stay unregistered).
docs = [
    "pypdf>=5",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "reportlab>=4",
    "defusedxml>=0.7",
]

[project.scripts]
geosgan-hive = "geosgan_hive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: requires real provider credentials (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
