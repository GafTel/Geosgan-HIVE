name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # W4 (v0.8.0): the approved optional document extras are installed so the
      # real parser tests (pypdf / python-docx / openpyxl / defusedxml; reportlab
      # only as a fixture writer) run on Linux CI. Resolution: pip resolves the
      # `docs` extra declared in pyproject.toml together with `dev`.
      - name: Install dependencies
        run: pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q

  # Phase 3: platform-specific coverage (Windows sandbox limitations are
  # documented; POSIX-only tests self-skip there via os.name guards)
  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Windows: docs extras installed too; worker-format parse tests assert
      # fail-closed there (parser isolation is POSIX-only by design)
      - name: Install dependencies
        run: pip install -e ".[dev,docs]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
